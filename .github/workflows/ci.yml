name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack (pnpm pinned in package.json)
        run: corepack enable

      - name: Install dependencies (frozen lockfile — no drift)
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run all tests
        run: pnpm test

      - name: Type-check all packages
        run: pnpm lint

      - name: Run the reproducible synthetic demonstration
        run: pnpm demo:synthetic
